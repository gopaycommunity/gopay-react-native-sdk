image: node:22

definitions:
    caches:
        # npm ci deletes node_modules, so cache npm's download cache instead.
        npm: ~/.npm
    steps:
        - step: &checks
              name: Lint, typecheck and test
              caches:
                  - npm
              script:
                  - npm ci
                  # The typecheck also covers example/, which needs its own dependencies.
                  - npm ci --prefix example
                  - npm run lint
                  - npm run typecheck
                  - npm test -- --ci
        - step: &github-sync
              name: Sync to GitHub
              clone:
                  depth: full
              script:
                  - git fetch origin master --tags
                  - git checkout -B master origin/master
                  # Authenticates via the repository SSH key configured in Pipelines settings,
                  # registered as a write-enabled deploy key on the GitHub mirror
                  - git remote add github git@github.com:gopaycommunity/gopay-react-native-sdk.git || true
                  - git fetch github
                  - git push github master --force-with-lease
                  - git push github --tags

pipelines:
    pull-requests:
        '**':
            - step: *checks
    branches:
        master:
            - step: *github-sync
    custom:
        github-sync:
            - step: *github-sync
